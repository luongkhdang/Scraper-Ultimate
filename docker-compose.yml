services:
  postgres:
    image: postgres:15
    container_name: news-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newsdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 'newsdb' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD: "'admin'"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - app_network

  # Tor service for IP rotation and anonymization
  tor:
    image: dperson/torproxy:latest
    container_name: tor
    restart: unless-stopped
    ports:
      - "9050:9050" # SOCKS proxy
      - "9051:9051" # Control port for IP rotation
    environment:
      TORPASSWORD: "your_secure_password"
      DNS1: "1.1.1.1"
      DNS2: "8.8.8.8"
    # Use the proper command format for dperson/torproxy
    command: -p "your_secure_password"
    # Use a more reliable health check without netcat
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 cat < /dev/null > /dev/tcp/localhost/9050 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - tor_data:/var/lib/tor
    networks:
      - app_network
    cap_add:
      - NET_ADMIN
    # Improve DNS resolution
    dns:
      - 1.1.1.1
      - 8.8.8.8

  scraper:
    build: .
    container_name: scraper
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    # Add a healthcheck to test the tor connection
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.socket(); s.connect((''tor'', 9050)); s.close()" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - ./:/app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: newsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Tor configuration
      RUNNING_IN_DOCKER: "true"
      TOR_ENABLED: "true"
      TOR_HOST: "tor" # Use the service name as the hostname
      TOR_SOCKS_PORT: 9050
      TOR_CONTROL_PORT: 9051
      TOR_CONTROL_PASSWORD: "your_secure_password" # Should match TORPASSWORD in tor service
      TORPASSWORD: "your_secure_password" # Added for compatibility
      TOR_CONTAINER_NAME: "tor"
      TOR_CIRCUIT_TIMEOUT: 5
    networks:
      - app_network

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: news-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: newsdb
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  tor_data: # New volume for Tor data
